apiVersion: apps/v1
kind: Deployment
metadata:
  name: seclock-deployment
  namespace: seclock
spec:
  replicas: 2
  selector:
    matchLabels:
      app: seclock
  template:
    metadata:
      labels:
        app: seclock
    spec:
      containers:
        - name: seclock
          image: 024757002695.dkr.ecr.ap-south-1.amazonaws.com/seclock:13
          ports:
            - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: seclock-service
  namespace: seclock
spec:
  type: LoadBalancer
  selector:
    app: seclock
  ports:
    - port: 80
      targetPort: 8000
